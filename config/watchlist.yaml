# Watchlist: the companies and projects we follow.
#
# How matching works
#   - A news item is tagged with a COMPANY when one of its `aliases` appears in the
#     title/summary AND (if `context` is set) at least one context word also appears.
#     Items that come from a company-specific source (its own RSS feed, EDGAR filings,
#     ASX announcements, newsroom page) are always tagged with that company.
#   - A news item is tagged with a PROJECT when one of the project's aliases appears
#     AND (if the project has `context`) a context word appears or the parent company
#     was also matched. Project hits are flagged as higher priority in alerts.
#   - `context` exists to kill false positives for common words ("Orion", "Minto",
#     "Ana Paula" is also a person's name, ...). Keep it for anything ambiguous.
#
# `status: needs_confirmation` = Claude's best guess at what you meant; please check.
#
# Sources per company (all optional):
#   google_news: true            -> Google News RSS search built from aliases/projects
#   languages: [en, es]          -> which Google News editions to search
#   rss: [url, ...]              -> any RSS/Atom feed (company newsroom, Newsfile, GlobeNewswire...)
#   edgar: "LAC"                 -> SEC EDGAR filings by ticker or CIK
#   asx: "LEL"                   -> ASX company announcements by ASX code
#   webpages: [{url, link_pattern}] -> scrape a newsroom page for new links

defaults:
  max_age_days: 10        # ignore items older than this (when the item has a date)
  languages: [en]

companies:

  - id: heliostar
    name: Heliostar Metals
    status: confirmed
    tickers: ["TSXV:HSTR", "OTCQX:HSTXF"]
    aliases: ["Heliostar", "Heliostar Metals"]
    google_news: true
    languages: [en, es]
    projects:
      - name: Ana Paula
        notes: Gold project, Guerrero, Mexico. Feasibility study planned Q2 2027.
        aliases: ["Ana Paula"]
        context: [gold, oro, Guerrero, mine, mina, project, proyecto, Heliostar, feasibility, drill]
    rss: ["https://feeds.newsfilecorp.com/company/7729"]   # official Newsfile releases

  - id: orion
    name: Orion Resource Partners (Orion Mine Finance)
    status: confirmed
    notes: >
      Private fund - no exchange filings, so we rely on news searches plus the
      portfolio projects below. Holds a Thacker Pass royalty and invested US$250M
      in Lithium Americas (2025). Also Orion Critical Mineral Consortium (Orion CMC).
    aliases: ["Orion Resource Partners", "Orion Resources", "Orion Mine Finance", "Orion CMC",
              "Orion Critical Mineral Consortium", "Orion"]
    # Bare "Orion" is far too common, so require a mining/finance word alongside it.
    context: [mining, mine, royalty, royalties, stream, "mine finance", "resource partners",
              gold, copper, lithium, financing, offtake, fund]
    google_news: true
    projects:
      - name: Thacker Pass
        notes: Lithium Americas' lithium project, Nevada. Orion holds a royalty and is an investor.
        aliases: ["Thacker Pass"]
      # --- The names below were given verbally; Claude could not confirm them. ---
      - name: PMED
        status: needs_confirmation
        aliases: ["PMED"]
        context: [Orion, mine, mining, royalty, project]
      - name: Shalkote
        status: needs_confirmation
        aliases: ["Shalkote"]
        context: [Orion, mine, mining, royalty, project]
      - name: Wanan
        status: needs_confirmation
        aliases: ["Wanan"]
        context: [Orion, mine, mining, royalty, project]

